; PlatformIO config for Nixo Soft PC Checker Dongle
; Board: LILYGO T-Dongle-S3 (ESP32-S3, 16MB Flash, ST7735 LCD)

[env:t-dongle-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; USB HID + CDC
build_flags = 
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED
    ; ST7735 TFT config for T-Dongle-S3
    -DST7735_DRIVER
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DTFT_BL=38
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSPI_FREQUENCY=27000000

; Flash partitions: bigger app + SPIFFS
board_build.partitions = default_16MB.csv
board_build.flash_size = 16MB
board_build.filesystem = spiffs

; Upload
upload_speed = 921600
monitor_speed = 115200

lib_deps =
    me-no-dev/ESPAsyncWebServer@^1.2.6
    me-no-dev/AsyncTCP@^1.1.4
    bodmer/TFT_eSPI@^2.5.43
    ricmoo/QRCode@^0.0.1
